name: Build & Push Docker Images to GHCR

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write    # REQUIRED to push to GHCR
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      #  LOGIN TO GHCR
      # -------------------------
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      #  BUILD + PUSH FRONTEND
      # -------------------------
      - name: Build Frontend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/se-frontend:latest ./frontend

      - name: Push Frontend image
        run: |
          docker push ghcr.io/${{ github.actor }}/se-frontend:latest

      # -------------------------
      #  BUILD + PUSH BACKEND
      # -------------------------
      - name: Build Backend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/se-backend:latest ./backend

      - name: Push Backend image
        run: |
          docker push ghcr.io/${{ github.actor }}/se-backend:latest
