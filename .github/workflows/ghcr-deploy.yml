name: Build & Push Docker Images to GHCR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase actor
        id: vars
        run: echo "actor_lowercase=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.vars.outputs.actor_lowercase }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FRONTEND
      - name: Build Frontend image
        run: docker build -t ghcr.io/${{ steps.vars.outputs.actor_lowercase }}/se-frontend:latest ./frontend

      - name: Push Frontend image
        run: docker push ghcr.io/${{ steps.vars.outputs.actor_lowercase }}/se-frontend:latest

      # BACKEND
      - name: Build Backend image
        run: docker build -t ghcr.io/${{ steps.vars.outputs.actor_lowercase }}/se-backend:latest ./backend

      - name: Push Backend image
        run: docker push ghcr.io/${{ steps.vars.outputs.actor_lowercase }}/se-backend:latest
