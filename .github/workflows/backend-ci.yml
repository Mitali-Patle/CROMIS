---
name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  backend-ci:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run backend (dry test)
        run: node server.js
