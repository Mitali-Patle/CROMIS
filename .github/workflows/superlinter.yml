---
name: Super-Linter

on:
  push:

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Ignore noisy frameworks
          FILTER_REGEX_EXCLUDE: "node_modules/|.next/|dist/"

          # Disable standard JS (conflicts with Next.js style)
          VALIDATE_JAVASCRIPT_STANDARD: false

          # Disable markdown errors
          VALIDATE_MARKDOWN: false

          # Disable CSS linting for Tailwind’s @rules
          VALIDATE_CSS: false
