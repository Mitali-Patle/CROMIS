---
name: Super Linter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  super-lint:
    name: Lint Project (Basic Only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main

          # Ignore unnecessary folders
          FILTER_REGEX_EXCLUDE: "node_modules/|.next/|dist/|build/"

          # Disable ALL JavaScript linters
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_ES: false

          # Disable CSS & Markdown (Tailwind + README issues)
          VALIDATE_CSS: false
          VALIDATE_MARKDOWN: false

          # Enable ONLY safe linters
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_ENV: true
