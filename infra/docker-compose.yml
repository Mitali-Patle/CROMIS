version: "3.9"

services:
  backend:
    build:
      context: ../backend
    container_name: backend_server
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env.example
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: frontend_app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge